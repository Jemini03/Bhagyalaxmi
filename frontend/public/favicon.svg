  <!-- Bold Industrial Letter B -->
  <text x="32" y="44" font-family="'Manrope', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
  <!-- Small spark -->
  <circle cx="48" cy="16" r="3" fill="#fde047" />
